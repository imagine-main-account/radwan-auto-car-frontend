<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fallbacks only: the build prerender (scripts/prerender.js) replaces the title, description and share
      tags with the admin's SEO settings, and adds the Google business data (JSON-LD) from the API.
    -->
    <title>مركز الرضوان لصيانة السيارات الحديثة</title>
    <meta name="description" content="مركز الرضوان لصيانة السيارات الحديثة: ميكانيكا وكهرباء لكل العربيات الحديثة." />
    <meta name="theme-color" content="#1c1e22" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- Social sharing (WhatsApp / Facebook). After deploying, change og:url to the absolute URL of your domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:title" content="مركز الرضوان لصيانة السيارات الحديثة" />
    <meta property="og:description" content="ميكانيكا وكهرباء لكل العربيات الحديثة." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
