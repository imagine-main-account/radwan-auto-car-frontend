            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        const: ok
              example:
                data:
                  status: ok
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`data.token` from POST /auth/login"
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUID v7 (time-based)
  responses:
    Unauthorized:
      description: No token, or it is invalid or expired. The admin portal logs out on this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "لازم تسجّل دخول الأول"
    NotFound:
      description: No item with this id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "العنصر ده مش موجود"
    TooLarge:
      description: The image is over 4 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "الصورة كبيرة قوي. أقصى حجم 4 ميجا."
    Invalid:
      description: "The data breaks a rule. `errors` has one message per field."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "الحقل ده مطلوب"
            errors:
              name: "الحقل ده مطلوب"
    TooManyAttempts:
      description: "5 failed logins for this email from this IP in 15 minutes"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "محاولات كتير غلط. استنى ربع ساعة وجرّب تاني."
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Arabic, shown to the owner as-is
        errors:
          type: object
          additionalProperties:
            type: string
          description: "Field path -> message"
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 (time-based)
        name:
          type: string
        email:
          type: string
          format: email
    SiteInfo:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        area:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: string
          minLength: 1
          maxLength: 200
        footerArea:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: "^01[0125]\\d{8}$"
        whatsapp:
          type: string
          pattern: "^01[0125]\\d{8}$"
        email:
          type: string
          format: email
          pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        mapUrl:
          type: string
          format: uri
        facebook:
          type: object
          properties:
            page:
              type: string
              format: uri
            reviews:
              type: string
              format: uri
            photos:
              type: string
              format: uri
          required: [page, reviews, photos]
        rating:
          type: object
          properties:
