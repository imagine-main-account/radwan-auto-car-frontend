# Copy of the backend's contract: https://radwan-auto-car-backend.vercel.app/openapi.json
# (Swagger UI: https://radwan-auto-car-backend.vercel.app/docs). The frontend follows it.
openapi: "3.1.0"
info:
  title: Radwan API
  version: "1.0.0"
  description: |-
    API for the El Radwan landing page and its /admin portal.

    - Success bodies are `{ "data": ... }`. Errors are `{ "message": "..." }` in Arabic, shown to the owner as-is.
    - Reading content and sending a review (**POST /review-submissions**) are public. Everything else needs a token: log in with **POST /auth/login**, then press **Authorize** and paste `data.token`.
    - Lists come back in display order.
    - Images are uploaded on what they belong to (**POST /gallery**, **PUT /hero/image**, **PUT /seo/image**), get a UUID v7 id and are served at **GET /images/{id}**. Image fields are absolute URLs.
servers:
  - url: "/"
security:
  - bearer: []
tags:
  - name: Auth
  - name: Content
  - name: Services
  - name: Reviews
  - name: Review submissions
  - name: Gallery
  - name: Images
  - name: Health
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: "Returns a JWT valid for 7 days. Copy `data.token`, press **Authorize** and paste it."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                password:
                  type: string
                  minLength: 1
              required: [email, password]
            example:
              email: "admin@radwan.com"
              password: ""
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token, user]
                    properties:
                      token:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/me:
    get:
      tags: [Auth]
      summary: The logged-in admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: "Tokens are stateless JWTs, so nothing is revoked: the client forgets its token, which works until it expires."
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password:
    put:
      tags: [Auth]
      summary: Change the password
      description: Tokens issued before the change stay valid until they expire (7 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
