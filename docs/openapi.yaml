  /review-submissions:
    post:
      tags: [Review submissions]
      summary: Send a review (landing page)
      description: "Public. The review waits for the owner to accept it. `fingerprint` identifies the browser; it and the IP are stored only as hashes, so the owner can block a spammer. A blocked sender also gets 200, but nothing is saved."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionInput"
            example:
              name: "كريم"
              text: "شغل محترم وسعر كويس."
              fingerprint: c0a8f3e2b91d4f6a
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: "null"
        "422":
          $ref: "#/components/responses/Invalid"
    get:
      tags: [Review submissions]
      summary: Reviews waiting for the owner, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /review-submissions/{id}/accept:
    parameters:
